name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_run:
    workflows: ["Update Recent Comments"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy app files to deployment directory
        run: |
          mkdir -p _site
          # Copy all files including hidden files and subdirectories
          cp -r app/. _site/
          # Use the supplied BS1 battlers in a game-specific runtime directory.
          mkdir -p _site/Battlers/bs1
          cp -r "temporary-graphics-folder-(dont-delete)/Graphics BS1/Battlers/." _site/Battlers/bs1/
          # Use the supplied RRW battlers in a game-specific runtime directory.
          mkdir -p _site/Battlers/rrw
          cp -r "temporary-graphics-folder-(dont-delete)/Graphics RRW/Battlers/." _site/Battlers/rrw/
          # Replace the source asset version with the deployed commit SHA.
          ASSET_VERSION="${GITHUB_SHA::12}"
          sed -i -E "s/\\?v=[^\"']+/?v=${ASSET_VERSION}/g" _site/index.html
          # Ensure .nojekyll is in the deployment directory (disable Jekyll)
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
