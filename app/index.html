<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YKE83WGR2K"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-YKE83WGR2K');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Souls Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20251120T055814Z">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div>
                    <h1 id="header-title">Black Souls Database</h1>
                    <p class="subtitle hidden" id="header-subtitle">Select a game to explore</p>
                </div>
            </div>
            <div class="header-controls">
                <button class="up-button hidden" id="up-button" title="Up">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="search-section hidden" id="search-section">
                    <div class="search-wrapper">
                        <div class="search-container">
                            <input 
                                type="text" 
                                id="search-input"
                                placeholder="Search for anything"
                                autocomplete="off"
                            >
                            <div class="search-icon">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 17C13.4183 17 17 13.4183 17 9C17 4.58172 13.4183 1 9 1C4.58172 1 1 4.58172 1 9C1 13.4183 4.58172 17 9 17Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M19 19L14.65 14.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                            <button class="search-clear hidden" id="search-clear" type="button" title="Clear search">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                        <div class="search-info">
                            <span id="results-count">0 skills found</span>
                        </div>
                    </div>
                </div>
                <button class="help-button" id="help-button" title="Help">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                        <path d="M9.09 9C9.3251 8.33167 9.78915 7.76811 10.4 7.40913C11.0108 7.05016 11.7289 6.91894 12.4272 7.03871C13.1255 7.15849 13.7588 7.52152 14.2151 8.06353C14.6713 8.60553 14.9211 9.29152 14.92 10C14.92 12 11.92 13 11.92 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="17" r="0.5" fill="currentColor" stroke="currentColor" stroke-width="1"/>
                    </svg>
                </button>
            </div>
        </header>
        
        <!-- Help Modal -->
        <div id="help-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Help & Information</h2>
                    <button class="modal-close" id="close-help">&times;</button>
                </div>
                <div class="modal-body" id="help-content">
                    <!-- Help content will be dynamically inserted here -->
                </div>
            </div>
        </div>

        <!-- Games View -->
        <div id="games-view" class="games-view">
            <div class="games-grid">
                <div class="game-card" data-game="bs2">
                    <div class="game-icon">
                        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="8" y="16" width="48" height="32" rx="4" stroke="currentColor" stroke-width="2"/>
                            <circle cx="20" cy="32" r="4" stroke="currentColor" stroke-width="2"/>
                            <path d="M40 26L44 32L40 38M48 26L52 32L48 38" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h2>Black Souls II</h2>
                </div>
                <!-- Future games can be added here -->
            </div>
        </div>

        <!-- Sections View -->
        <div id="sections-view" class="sections-view hidden">
            <div class="sections-grid">
                <div class="section-card" data-section="skills">
                    <div class="section-icon">
                        <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M32 4L36.5 24.5L56 20L44 32L56 44L36.5 39.5L32 60L27.5 39.5L8 44L20 32L8 20L27.5 24.5L32 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        </svg>
                    </div>
                    <h2>Skills</h2>
                </div>
                <div class="section-card" data-section="states">
                    <div class="section-icon">
                        <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="8" y="8" width="48" height="48" rx="8" stroke="currentColor" stroke-width="2"/>
                            <path d="M32 20L28 28L20 28L26 34L24 42L32 38L40 42L38 34L44 28L36 28L32 20Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        </svg>
                    </div>
                    <h2>States</h2>
                </div>
                <div class="section-card" data-section="weapons">
                    <div class="section-icon">
                        <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M32 8L28 24L12 20L24 32L12 44L28 40L32 56L36 40L52 44L40 32L52 20L36 24L32 8Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                            <path d="M24 32L40 32" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <h2>Weapons</h2>
                </div>
                <div class="section-card" data-section="armors">
                    <div class="section-icon">
                        <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="16" y="8" width="32" height="48" rx="4" stroke="currentColor" stroke-width="2"/>
                            <path d="M24 16L40 16M24 24L40 24M24 32L40 32M24 40L40 40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="32" cy="48" r="4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </div>
                    <h2>Armors</h2>
                </div>
                <div class="section-card" data-section="enemies">
                    <div class="section-icon">
                        <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="32" cy="20" r="8" stroke="currentColor" stroke-width="2"/>
                            <path d="M16 48C16 40 20 32 32 32C44 32 48 40 48 48" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M24 40L20 44M40 40L44 44" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <h2>Enemies</h2>
                </div>
                <div class="section-card" data-section="items">
                    <div class="section-icon">
                        <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M32 8L20 16L20 32L32 40L44 32L44 16L32 8Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                            <path d="M20 32L32 40L44 32" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M32 40L32 56" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <h2>Items</h2>
                </div>
                <div class="section-card" data-section="elements">
                    <div class="section-icon">
                        <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="32" cy="32" r="20" stroke="currentColor" stroke-width="2"/>
                            <path d="M32 12L36 28L52 24L40 32L52 40L36 36L32 52L28 36L12 40L24 32L12 24L28 28L32 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        </svg>
                    </div>
                    <h2>Elements</h2>
                </div>
                <div class="section-card" data-section="stats">
                    <div class="section-icon">
                        <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="8" y="8" width="48" height="48" rx="4" stroke="currentColor" stroke-width="2"/>
                            <path d="M16 32L24 24L32 32L40 16L48 40" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                            <path d="M16 48L48 48" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M32 8L32 48" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <h2>Stats</h2>
                </div>
                <!-- Future sections can be added here -->
            </div>
        </div>

        <div class="main-content hidden" id="main-content">
            <div class="results-panel">
                <div id="results-list" class="results-list">
                    <!-- Skill cards will be inserted here -->
                </div>
            </div>

            <div class="detail-panel" id="detail-panel">
                <div class="detail-placeholder">
                    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M32 4L36.5 24.5L56 20L44 32L56 44L36.5 39.5L32 60L27.5 39.5L8 44L20 32L8 20L27.5 24.5L32 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                    <p>Select an item to view details</p>
                </div>
                <div id="detail-content" class="detail-content" style="display: none;">
                    <!-- Skill details will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script src="data.js?v=20251120T060419Z"></script>
    <script src="script.js?v=20251120T002546Z"></script>
</body>
</html>
